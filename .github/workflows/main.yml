name: Build PlatformIO project
on:
  push
  
jobs:
 build:
   runs-on: ubuntu-latest
   steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
  
    - name: Run KiCad actions
      uses: actions-for-kicad/kicad-actions@v2-k10.0
      with:
        schematic_file_name: ./PCD_project/kp-ptr.kicad_sch
        symbol_libraries: "symbol-library=./symbol-library.kicad_sym"
        run_erc: true
        schematic_output_pdf: true
  
        pcb_file_name: ./PCB_project/kp-ptr.kicad_pcb
        footprint_libraries: "footprint-library=./PCB_project/KP-PTR_lib.pretty"
        run_drc: true
        pcb_output_gerbers_and_drill: true
        pcb_output_image: true
  
    - name: Upload schematic
      uses: actions/upload-artifact@v7
      with:
        path: ./build/schematic.pdf
        archive: false
  
    - name: Upload gerbers and drill file
      uses: actions/upload-artifact@v7
      with:
        name: Gerbers
        path: ./build/gerbers
  
    - name: Upload image render
      uses: actions/upload-artifact@v7
      with:
        path: ./build/pcb.png
        archive: false
